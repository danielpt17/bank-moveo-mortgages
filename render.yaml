# Render Blueprint: the API as a Docker web service. Postgres is on Neon and Redis on Upstash
# (both free, no card); their URLs are entered once in the Render dashboard (sync: false).
services:
  - type: web
    name: bank-moveo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: '3000'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled connection string (postgresql://…?sslmode=require)
      - key: REDIS_URL
        sync: false # Upstash connection string (rediss://default:…@….upstash.io:6379)
      - key: CORS_ORIGINS
        sync: false # https://<web>.vercel.app
      - key: LOBBY_CACHE_TTL_SECONDS
        value: '300'
      - key: DEMO_CUSTOMER_ID
        value: 11111111-1111-4111-8111-111111111111
      - key: BUSINESS_TIMEZONE
        value: Asia/Jerusalem
      - key: DEMO_RESET_TOKEN
        generateValue: true
