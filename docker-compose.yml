services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moveo
      POSTGRES_PASSWORD: moveo
      POSTGRES_DB: moveo
    ports:
      # Override POSTGRES_PORT in a root .env if 5432 is taken on your machine.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moveo -d moveo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://moveo:moveo@postgres:5432/moveo
      REDIS_URL: redis://redis:6379
      LOBBY_CACHE_TTL_SECONDS: 300
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      DEMO_CUSTOMER_ID: 11111111-1111-4111-8111-111111111111
      BUSINESS_TIMEZONE: Asia/Jerusalem
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Same-origin in Docker: nginx proxies /api to the api service.
        VITE_API_BASE_URL: /api/v1
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
